<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Buttons</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    background-color: #fff;
}

.link-icons {
    display: grid;
    grid-template-columns: repeat(2, max-content);
    justify-content: center;
    column-gap: 50px;
    row-gap: 12px;
}


/* ボタン */

.button-40 {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;

    width: 200px;
    margin: 0 auto;

    padding: .9em 2em;

    border: none;
    border-radius: 5px;

    box-shadow: 0 7px 10px rgb(0 0 0 / 10%);

    background-color: #fff;
    color: #666;

    font-size: 1em;
    font-weight: 700;

    text-decoration: none;

    box-sizing: border-box;

    transition:
        transform .3s,
        box-shadow .3s;
}


/* マウスオン */

.button-40:hover {
    transform: translateY(-2px);

    box-shadow: 0 7px 10px rgb(0 0 0 / 15%);
}


/* 右矢印 */

.button-40::after {
    transform: rotate(45deg);

    width: 5px;
    height: 5px;

    margin-left: 10px;

    border-top: 2px solid #333;
    border-right: 2px solid #333;

    content: '';
}


/* スマートフォン */

@media (max-width: 600px) {

    .link-icons {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .button-40 {
        width: 250px;
    }

}

</style>

</head>

<body>

<div class="link-icons">


    <!-- X -->
    <a
        href="https://twitter.com/halfgreen208"
        target="_blank"
        rel="noopener noreferrer"
        class="button-40"
    >
        X
    </a>


    <!-- YouTube -->
    <a
        href="https://youtube.com/channel/UCQQYet3vHfXFBD6vd1yIyww?si=gJJ3OEkaKeOpmWtr"
        target="_blank"
        rel="noopener noreferrer"
        class="button-40"
    >
        YouTube
    </a>


    <!-- Amazon -->
    <a
        href="https://www.amazon.jp/hz/wishlist/ls/23D9O8EPUDH2V?ref_=wl_share"
        target="_blank"
        rel="noopener noreferrer"
        class="button-40"
    >
        Amazon
    </a>


    <!-- fusetter -->
    <a
        href="https://fusetter.com/u/halfgreen208"
        target="_blank"
        rel="noopener noreferrer"
        class="button-40"
    >
        fusetter
    </a>


</div>

</body>
</html>
